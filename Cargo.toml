[package]
name = "memory_hierarchy_explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
plotters = "0.3.7"
rand = "0.9.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
smallrand = "1.0.1"


[lib]
name = "memory_hierarchy_explorer"
src = "src/lib.rs"

[[bin]]
name = "explorer"
path = "bins/explore.rs"


[[bin]]
name = "serial"
path = "bins/serial_mem_scan.rs"


[[bin]]
name = "chasing"
path = "bins/chasing_mem_scan.rs"
